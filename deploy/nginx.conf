limit_req_zone $binary_remote_addr zone=lead_api:10m rate=10r/m;
server {
  listen 80;
  server_name astartup.makemeartist.com;
  client_max_body_size 1m;
  location /api/leads { limit_req zone=lead_api burst=5 nodelay; proxy_pass http://app:3000; include /etc/nginx/proxy_params; }
  location /assets/ { proxy_pass http://app:3000; expires 30d; add_header Cache-Control "public, immutable"; }
  location / { proxy_pass http://app:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
}
